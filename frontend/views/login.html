<section class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-3">Account</h1>
    <p class="text-muted">Static Milestone 1 form. Authentication will use JWT against the PHP API later.</p>

    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button
          class="nav-link active"
          id="login-tab"
          data-bs-toggle="tab"
          data-bs-target="#login-panel"
          type="button"
          role="tab"
        >
          Login
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          id="register-tab"
          data-bs-toggle="tab"
          data-bs-target="#register-panel"
          type="button"
          role="tab"
        >
          Register
        </button>
      </li>
    </ul>

    <div class="tab-content border border-top-0 rounded-bottom p-4 bg-white">
      <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
        <form>
          <div class="mb-3">
            <label class="form-label" for="login-email">Email</label>
            <input class="form-control" id="login-email" type="email" placeholder="you@camp.mail" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-control" id="login-password" type="password" />
          </div>
          <button class="btn btn-ember" type="button">Sign in</button>
        </form>
      </div>
      <div class="tab-pane fade" id="register-panel" role="tabpanel">
        <form>
          <div class="mb-3">
            <label class="form-label" for="reg-name">Display name</label>
            <input class="form-control" id="reg-name" type="text" placeholder="Trail name" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-email">Email</label>
            <input class="form-control" id="reg-email" type="email" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-control" id="reg-password" type="password" />
          </div>
          <button class="btn btn-ember" type="button">Create account</button>
        </form>
      </div>
    </div>
  </div>
</section>
