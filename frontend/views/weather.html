<section>
  <h1 class="h3">Weather &amp; camp recommendations</h1>

  <form id="weather-form" class="row g-2 mb-4">
    <div class="col-sm-8 col-md-6">
      <label class="form-label" for="weather-city">City</label>
      <input class="form-control" id="weather-city" name="city" type="text" placeholder="e.g. Sarajevo,BA" maxlength="100" required />
    </div>
    <div class="col-sm-4 col-md-4 d-flex align-items-end">
      <button class="btn btn-ember w-100" type="submit">Check current weather</button>
    </div>
  </form>

  <p id="weather-status" role="status"></p>
  <div id="weather-result" class="row g-3" hidden>
    <div class="col-md-6">
      <div class="card card-tool h-100">
        <div class="card-body">
          <h2 class="h5" id="weather-location"></h2>
          <p class="display-6 mb-1" id="weather-temperature"></p>
          <p class="mb-0" id="weather-condition"></p>
          <p class="small text-muted mt-2 mb-0" id="weather-details"></p>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card card-tool h-100">
        <div class="card-body">
          <h2 class="h5">Camp tips</h2>
          <ul id="weather-tips" class="mb-0"></ul>
        </div>
      </div>
    </div>
  </div>
</section>
