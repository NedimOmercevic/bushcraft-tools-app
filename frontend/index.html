<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bushcraft Tools</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-bushcraft">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#/dashboard">
          <span class="brand-mark">BT</span>
          Bushcraft Tools
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" data-route="dashboard" href="#/dashboard">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-route="catalog" href="#/catalog">Catalog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-route="details" href="#/details">Tool details</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-route="weather" href="#/weather">Weather</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-route="profile" href="#/profile">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-route="login" href="#/login">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="view-root" class="container py-4 flex-grow-1"></main>

    <footer class="app-footer py-3 mt-auto">
      <div class="container small d-flex justify-content-between">
        <span>Bushcraft Tools — Milestone 1 SPA</span>
        <span>REST API coming in later milestones</span>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
